spring:
  application:
    name: code-audit-orchestrator

  datasource:
    url: jdbc:sqlite:./data/code-audit.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: false

server:
  port: 8080

application:
  security:
    jwt:
      # Minimum 32 chars. Override with JWT_SECRET env var in production.
      secret-key: ${JWT_SECRET:change-me-in-production-min-32-chars!!}
      expiration: 86400000  # 24 h

app:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${AI_SERVICE_API_KEY:changeme}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
