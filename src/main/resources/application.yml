spring:
  application:
    name: code-audit-orchestrator

  datasource:
    url: jdbc:sqlite:${DB_PATH:./data/codeaudit.db}
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mvc:
    throw-exception-if-no-handler-found: true

server:
  port: 8080
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-min-256-bits-long-change-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${INTERNAL_API_KEY:abc123}
